name: Recolha Diária de Preços

on:
  schedule:
    # 12:00 UTC ≈ 13:00 em Portugal (verão) / 12:00 (inverno)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar e disparar recolha no servidor
        env:
          API_URL: ${{ secrets.PRICESCOUTPT_API_URL }}
          SCRAPE_SECRET: ${{ secrets.PRICESCOUTPT_SCRAPE_SECRET }}
        run: |
          curl -sf --retry 3 --retry-delay 15 --max-time 120 \
            -X POST "${API_URL}/api/scrape" \
            -H "Content-Type: application/json" \
            -H "x-scrape-secret: ${SCRAPE_SECRET}" \
            -d '{"scrapers":["Continente","Lidl","PingoDoce","Aldi"]}'

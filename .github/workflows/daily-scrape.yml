name: Recolha Diária de Preços

on:
  schedule:
    # Portugal continental: 12:00 no inverno / 13:00 no verão.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      scrapers:
        description: 'Coletores a executar'
        type: choice
        default: all
        options:
          - all
          - Froiz,Aldi
          - Aldi,Lidl,PingoDoce,Auchan,Continente
          - Continente
          - Lidl
          - PingoDoce
          - Aldi
          - Auchan
          - Froiz
      details_limit:
        description: 'Máximo de páginas de detalhe por coletor'
        type: choice
        default: '100'
        options: ['0', '25', '100', '250']

permissions:
  contents: read

concurrency:
  group: pricescoutpt-production-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Instalar dependências
        run: pip install -r scraper/requirements.txt
      - name: Recolher preços e verificar espaço disponível
        env:
          DATABASE_URL: ${{ secrets.PRICESCOUTPT_DATABASE_URL }}
          PRICESCOUT_API_URL: ${{ vars.PRICESCOUT_API_URL }}
          PRICESCOUT_API_SCRAPE_SECRET: ${{ secrets.PRICESCOUT_API_SCRAPE_SECRET }}
          SELECTED_SCRAPERS: ${{ inputs.scrapers || 'all' }}
          DETAILS_LIMIT: ${{ inputs.details_limit || '100' }}
        run: python -u deploy/free/collect.py --scrapers "$SELECTED_SCRAPERS" --details-limit "$DETAILS_LIMIT"

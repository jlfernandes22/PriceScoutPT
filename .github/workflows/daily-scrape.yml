name: Recolha Diária de Preços

on:
  schedule:
    # 12:00 UTC ≈ 13:00 em Portugal (verão) / 12:00 (inverno)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A recolha completa (Continente ~30min + restantes) ronda os 50 minutos —
    # dentro do timeout default de 6h do job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependências do scraper
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Recolher preços dos 5 supermercados (Continente, Lidl, Pingo Doce, Aldi, Auchan)
        working-directory: scraper
        env:
          # Ligação direta ao PostgreSQL da Azure (SSLMODE via query string).
          # O runner do GH Actions é fiável (nunca "dorme"), ao contrário do
          # container gratuito que escala para zero e mata recolhas longas.
          DATABASE_URL: ${{ secrets.PRICESCOUTPT_DATABASE_URL }}
          # Opcional: alertas no final da recolha
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py
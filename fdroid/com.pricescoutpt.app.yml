Name: PriceScoutPT
AutoName: PriceScoutPT
Summary: Comparador de preços dos supermercados portugueses (offline)
Description: |
  Compara preços de Continente, Lidl, Pingo Doce, Aldi e Auchan num só lugar,
  mesmo sem internet. O catálogo é descarregado para o telemóvel (offline-first):
  pesquisa, cria o teu cabaz e vê em que supermercado fica mais barato.

  • Catálogo offline (WatermelonDB/SQLite)
  • Pesquisa com filtros de supermercado e categoria
  • Cabaz de compras com comparação de preços entre supermercados
  • Histórico de preços dos últimos 30 dias
  • Recolha diária automática (servidor + GitHub Actions)

  Sem contas, sem tracking, sem anúncios. Os preços são de referência nacional
  (catálogo online) e podem variar nas lojas físicas por região.

RepoType: git
Repo: https://github.com/jlfernandes22/PriceScoutPT

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: mobile
    sudo:
      - apt-get update
      - apt-get install -y curl ca-certificates gnupg
      - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      - apt-get install -y nodejs
    output: android/app/build/outputs/apk/release/app-release.apk
    prebuild: npm ci --legacy-peer-deps
    build: cd android && ./gradlew assembleRelease


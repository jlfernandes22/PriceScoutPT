# F-Droid metadata para PriceScoutPT (com.pricescoutpt.app)
#
# Submissão: copiar para o repositório https://gitlab.com/fdroid/fdroiddata
# em metadata/com.pricescoutpt.app.yml e abrir um Merge Request (ver SUBMISSION.md).
#
# Estratégia de build:
#  - O projeto nativo android/ está commitado no upstream (expo prebuild já feito),
#    pelo que o build só precisa de Node (para o Metro bundler + autolinking) e Gradle.
#  - O F-Droid assina com as suas próprias chaves (a assinatura local é ignorada);
#    sem keystore.properties, o gradle usa a debug keystore — normal para o build server.

Categories:
  - Market & Price
License: GPL-3.0-or-later
AuthorName: PriceScoutPT
WebSite: https://github.com/jlfernandes22/PriceScoutPT
SourceCode: https://github.com/jlfernandes22/PriceScoutPT
IssueTracker: https://github.com/jlfernandes22/PriceScoutPT/issues

AutoName: PriceScoutPT
Name: PriceScoutPT
Summary: Comparador de preços dos supermercados portugueses (offline)
Description: |
  Compara preços de Continente, Lidl, Pingo Doce, Aldi e Auchan num só lugar,
  mesmo sem internet. O catálogo é descarregado para o telemóvel (offline-first):
  pesquisa, cria o teu cabaz e vê em que supermercado fica mais barato.

  • Catálogo offline (WatermelonDB/SQLite)
  • Pesquisa com filtros de supermercado e categoria
  • Cabaz de compras com comparação de preços entre supermercados
  • Histórico de preços dos últimos 30 dias
  • Recolha diária automática (servidor + GitHub Actions)

  Sem contas, sem tracking, sem anúncios. Os preços são de referência nacional
  (catálogo online) e podem variar nas lojas físicas por região.

RepoType: git
Repo: https://github.com/jlfernandes22/PriceScoutPT

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: mobile
    sudo:
      - apt-get update
      - apt-get install -y curl ca-certificates gnupg
      - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      - apt-get install -y nodejs
    prebuild:
      - npm ci --legacy-peer-deps
    build:
      - cd android && ./gradlew assembleRelease
    output: android/app/build/outputs/apk/release/app-release.apk

# Autoupdate: novo tag → novo build. versionName/versionCode no build.gradle (estático).
AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1

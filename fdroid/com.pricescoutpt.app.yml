AuthorName: PriceScoutPT
WebSite: https://github.com/jlfernandes22/PriceScoutPT
SourceCode: https://github.com/jlfernandes22/PriceScoutPT
IssueTracker: https://github.com/jlfernandes22/PriceScoutPT/issues

AutoName: PriceScoutPT
RepoType: git
Repo: https://github.com/jlfernandes22/PriceScoutPT

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 7f8ef02fe14f140cf15998d6eaeb716891fa56ad
    subdir: mobile/android/app
    sudo:
      - apt-get update
      - apt-get install -y curl ca-certificates gnupg
      - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      - apt-get install -y nodejs
    init:
      - cd ../..
      - npm ci --legacy-peer-deps
    prebuild:
      - cd ../..
      - sed -i -e '/jvmToolchain\|JavaVersion/s/17/21/'
        node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release.apk
    scanignore:
      - mobile/node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - mobile/node_modules/react-native/ReactAndroid/publish.gradle
      - mobile/node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - mobile/node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - mobile/node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - mobile/node_modules/react-native-safe-area-context/android/build.gradle
      - mobile/node_modules/react-native-svg/android/build.gradle
    scandelete:
      - mobile/node_modules

MaintainerNotes: |-
  React Native/Expo app built following templates/build-react-native.yml: the
  React Native Gradle plugin is patched to use JDK 21 (buildserver default)
  instead of 17, node_modules is scandeleted so the prebuilt binaries (Hermes,
  local Maven repos) are removed from the source scan, and the Gradle files
  that reference local Maven repos are scanignored.

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
